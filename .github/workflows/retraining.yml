name: PredictOps Automated Retraining

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install mlflow

      - name: Check data drift
        run: python src/drift_detection.py

      - name: Retrain model
        run: python src/model_training.py